<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cheater — export</title>
<style>
/* ==========================================================================
   Dark technical-instrument surface. Graphite, hairlines, one amber accent,
   monospace for anything machine-ish. No gradients, no decorative shadows.
   ========================================================================== */
:root{
  --bg:#0C0D0F;
  --s1:#121316;
  --s2:#16181B;
  --s3:#1B1E22;
  --line:#1E2126;
  --line2:#2A2D33;
  --fg:#E8E6E1;
  --mut:#8A8F98;
  --mut2:#6B7077;
  --amber:#FFB224;
  --amber-h:#FFC04A;
  --red:#FF4A3D;
  --green:#5FD08A;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  --sans:system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:13px;
  display:flex;flex-direction:column;overflow:hidden;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}

/* ---------------------------------------------------------------- header --- */
.hdr{
  display:flex;align-items:center;gap:14px;padding:0 14px;height:38px;
  background:var(--s1);border-bottom:1px solid var(--line2);flex:0 0 auto;
}
.brand{
  font-family:var(--mono);font-size:11px;letter-spacing:.18em;color:var(--amber);
  text-transform:uppercase;display:flex;align-items:center;gap:7px;
}
.brand::before{
  content:"";width:7px;height:7px;background:var(--amber);
  box-shadow:0 0 0 2px rgba(255,178,36,.18);
}
.src{
  font-family:var(--mono);font-size:11px;color:var(--mut);flex:1;min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.src a{color:var(--mut);text-decoration:none}
.src a:hover{color:var(--fg)}
.ver{font-family:var(--mono);font-size:10px;color:var(--mut2);letter-spacing:.06em}

/* ----------------------------------------------------------- diagnostics --- */
.diag{flex:0 0 auto;background:var(--s1);border-bottom:1px solid var(--line)}
.diag-bar{
  display:flex;align-items:center;gap:10px;padding:7px 14px;cursor:pointer;
  user-select:none;flex-wrap:wrap;
}
.diag-bar:hover{background:var(--s2)}
.caret{
  font-family:var(--mono);font-size:9px;color:var(--mut2);width:9px;flex:0 0 auto;
  transition:transform .12s linear;
}
.diag.open .caret{transform:rotate(90deg)}
.diag-title{
  font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--mut);flex:0 0 auto;margin-right:2px;
}
.pill{
  font-family:var(--mono);font-size:10.5px;line-height:1;padding:4px 7px;
  border:1px solid var(--line2);background:var(--s2);color:var(--mut);
  display:inline-flex;gap:5px;align-items:center;white-space:nowrap;
}
.pill b{color:var(--fg);font-weight:400}
.pill.on b{color:var(--amber)}
.pill.warn{color:#E0B15C;border-color:#5E4715;background:#1C1608}
.pill.warn b{color:var(--amber)}
.pill.bad{color:#E8938B;border-color:#5E2420;background:#1C0F0E}
.pill.bad b{color:var(--red)}
.diag-body{display:none;padding:0 14px 12px}
.diag.open .diag-body{display:block}
.rows{border:1px solid var(--line);border-bottom:0}
.row{
  display:flex;align-items:center;gap:10px;padding:6px 9px;
  border-bottom:1px solid var(--line);font-family:var(--mono);font-size:11px;
  background:var(--s2);
}
.row .tag{color:var(--amber);min-width:76px}
.row .cls{color:var(--mut);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .dim{color:var(--mut2)}
.badge{
  font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;padding:2px 5px;
  border:1px solid var(--line2);color:var(--mut);
}
.badge.w{border-color:#3A4759;color:#8FB0D6}
.badge.d{border-color:#5E4715;color:#E0B15C}
.notes{margin-top:9px;display:flex;flex-direction:column;gap:4px}
.note{
  font-family:var(--mono);font-size:10.5px;color:var(--mut);
  padding-left:11px;position:relative;line-height:1.5;
}
.note::before{content:"—";position:absolute;left:0;color:var(--mut2)}
.note.warn{color:#E0B15C}

/* ------------------------------------------------------------------ tabs --- */
.tabs{
  display:flex;align-items:stretch;gap:0;background:var(--s1);
  border-bottom:1px solid var(--line2);flex:0 0 auto;padding:0 8px;
}
.tab{
  font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--mut);padding:0 13px;height:33px;display:flex;align-items:center;gap:6px;
  border-bottom:2px solid transparent;
}
.tab:hover{color:var(--fg)}
.tab.sel{color:var(--fg);border-bottom-color:var(--amber)}
.tab .llm{
  font-size:8.5px;letter-spacing:.08em;padding:2px 4px;border:1px solid var(--line2);
  color:var(--amber);
}
.tabs .spacer{flex:1}
.tools{display:flex;align-items:center;gap:8px;padding-right:4px}
.seg{display:flex;border:1px solid var(--line2);background:var(--s2)}
.seg button{
  font-family:var(--mono);font-size:10.5px;padding:4px 8px;color:var(--mut);
  border-right:1px solid var(--line2);
}
.seg button:last-child{border-right:0}
.seg button:hover{color:var(--fg);background:var(--s3)}
.seg button.sel{color:var(--bg);background:var(--amber)}
.meta{font-family:var(--mono);font-size:10.5px;color:var(--mut2)}
.meta b{color:var(--mut);font-weight:400}

/* ----------------------------------------------------------------- panes --- */
.panes{flex:1 1 auto;min-height:0;position:relative}
.pane{position:absolute;inset:0;display:none;overflow:auto}
.pane.sel{display:block}

/* Dot grid so a transparent or white component still reads as a component. */
#preview-pane{
  background-color:#0F1113;
  background-image:radial-gradient(circle at 1px 1px, #24272C 1px, transparent 0);
  background-size:14px 14px;
  padding:22px;
}
#preview-pane.light{
  background-color:#EDEEF0;
  background-image:radial-gradient(circle at 1px 1px, #C9CCD1 1px, transparent 0);
}
.stage{margin:0 auto;transform-origin:top left}
#frame{
  display:block;border:1px solid var(--line2);background:#fff;width:100%;
}
#preview-pane.light #frame{border-color:#C9CCD1}

.code-head{
  display:flex;align-items:center;gap:10px;padding:6px 12px;background:var(--s1);
  border-bottom:1px solid var(--line);position:sticky;top:0;z-index:2;
}
pre{
  font-family:var(--mono);font-size:11.5px;line-height:1.62;padding:12px 14px 40px;
  white-space:pre;tab-size:2;color:#C9CDD3;
}
.tk-tag{color:#7FB2E5}
.tk-attr{color:#D9A85C}
.tk-string{color:#8FC98F}
.tk-punct{color:#6B7077}
.tk-comment{color:#5C636B;font-style:italic}
.tk-number{color:#C99A6B}
.tk-value{color:#C79BD0}
.tk-keyword{color:var(--amber)}
.tk-cls{color:#7FB2E5}

/* ---------------------------------------------------------------- footer --- */
.ftr{
  display:flex;align-items:center;gap:8px;padding:0 12px;height:42px;
  background:var(--s1);border-top:1px solid var(--line2);flex:0 0 auto;
}
.btn{
  font-family:var(--mono);font-size:11px;letter-spacing:.06em;padding:7px 12px;
  border:1px solid var(--line2);background:var(--s2);color:var(--fg);
}
.btn:hover{border-color:#3A3E45;background:var(--s3)}
.btn.pri{border-color:var(--amber);color:var(--amber)}
.btn.pri:hover{background:rgba(255,178,36,.09);color:var(--amber-h);border-color:var(--amber-h)}
.ftr .spacer{flex:1}
.hint{font-family:var(--mono);font-size:10.5px;color:var(--mut2)}

.toast{
  position:fixed;left:50%;bottom:56px;transform:translateX(-50%);
  background:var(--s2);border:1px solid var(--line2);border-left:2px solid var(--amber);
  padding:8px 13px;font-family:var(--mono);font-size:11px;color:var(--fg);
  opacity:0;pointer-events:none;transition:opacity .14s linear;z-index:50;max-width:70vw;
}
.toast.show{opacity:1}
.toast.bad{border-left-color:var(--red)}

.hist-btn{
  font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;padding:4px 9px;
  border:1px solid var(--line2);color:var(--mut);background:var(--s2);flex:0 0 auto;
}
.hist-btn:hover{color:var(--fg);border-color:#3A3E45}
.hist-btn.on{color:var(--bg);background:var(--amber);border-color:var(--amber)}
.hist{
  display:none;flex:0 0 auto;background:var(--s1);border-bottom:1px solid var(--line2);
  padding:10px 14px 12px;max-height:44vh;overflow:auto;
}
.hist.open{display:block}
.hist-head{display:flex;align-items:center;gap:8px;padding-bottom:8px}
.hist-head .spacer{flex:1}
.hist-rows{display:flex;flex-direction:column;gap:1px}
.hrow{
  display:flex;align-items:center;gap:11px;padding:7px 9px;background:var(--s2);
  border:1px solid var(--line);font-family:var(--mono);font-size:11px;
}
.hrow.current{border-color:var(--amber)}
.hrow .when{color:var(--mut2);width:104px;flex:0 0 auto}
.hrow .what{color:var(--amber);width:150px;flex:0 0 auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hrow .where{color:var(--mut);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hrow .dim{color:var(--mut2);flex:0 0 auto}
.hrow .acts{display:flex;gap:5px;flex:0 0 auto}
.hrow button{
  font-family:var(--mono);font-size:10px;padding:3px 7px;border:1px solid var(--line2);
  color:var(--mut);background:var(--s3);
}
.hrow button:hover{color:var(--fg);border-color:#3A3E45}
.hrow button.open-btn:hover{color:var(--amber);border-color:var(--amber)}
.hist-empty{font-family:var(--mono);font-size:10.5px;color:var(--mut2);padding:4px 0}
.loading{
  position:fixed;inset:0;z-index:60;background:rgba(12,13,15,.92);
  display:flex;align-items:center;justify-content:center;
}
.loading.done{display:none}
.loading-box{
  min-width:320px;background:var(--s1);border:1px solid var(--line2);
  border-left:2px solid var(--amber);padding:14px 16px 15px;
}
.loading-row{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.loading-label{font-family:var(--mono);font-size:11.5px;color:var(--fg);letter-spacing:.02em}
.loading-pct{font-family:var(--mono);font-size:11.5px;color:var(--amber);font-variant-numeric:tabular-nums}
.loading-track{margin-top:9px;height:2px;background:var(--line2);overflow:hidden}
.loading-fill{height:100%;background:var(--amber);width:0%;transition:width .12s linear}
.loading-sub{margin-top:8px;font-family:var(--mono);font-size:10.5px;color:var(--mut2)}
.empty{
  display:flex;flex-direction:column;gap:8px;align-items:center;justify-content:center;
  height:100%;font-family:var(--mono);font-size:12px;color:var(--mut);text-align:center;
}
.empty b{color:var(--amber);font-weight:400;letter-spacing:.1em;text-transform:uppercase;font-size:11px}
.hidden{display:none !important}
</style>
</head>
<body>

<header class="hdr">
  <span class="brand">Cheater</span>
  <span class="src" id="src"></span>
  <button class="hist-btn" id="hist-btn" title="Recent captures">History</button>
  <span class="ver" id="ver"></span>
</header>

<section class="hist" id="hist">
  <div class="hist-head">
    <span class="diag-title">Recent captures</span>
    <span class="spacer"></span>
    <button class="btn" id="hist-clear">Clear all</button>
    <button class="btn" id="hist-close">Close</button>
  </div>
  <div class="hist-rows" id="hist-rows"></div>
</section>

<section class="diag" id="diag">
  <div class="diag-bar" id="diag-bar">
    <span class="caret">▶</span>
    <span class="diag-title">Diagnostics</span>
    <span id="pills"></span>
  </div>
  <div class="diag-body">
    <div class="rows" id="rows"></div>
    <div class="notes" id="notes"></div>
  </div>
</section>

<nav class="tabs">
  <button class="tab sel" data-tab="preview">Preview</button>
  <button class="tab" data-tab="html">HTML</button>
  <button class="tab" data-tab="toon">TOON <span class="llm">LLM</span></button>
  <span class="spacer"></span>
  <div class="tools" id="preview-tools">
    <span class="meta">width</span>
    <div class="seg" id="width-seg">
      <button data-w="fit" class="sel">Fit</button>
      <button data-w="1280">1280</button>
      <button data-w="768">768</button>
      <button data-w="375">375</button>
    </div>
    <div class="seg" id="surface-seg">
      <button data-surface="dark" class="sel">Dark</button>
      <button data-surface="light">Light</button>
    </div>
  </div>
  <div class="tools hidden" id="code-tools">
    <span class="meta" id="code-meta"></span>
    <button class="btn" id="copy">Copy</button>
  </div>
</nav>

<main class="panes">
  <div class="pane sel" id="preview-pane">
    <div class="stage" id="stage">
      <iframe id="frame" sandbox="allow-same-origin" title="Export preview"></iframe>
    </div>
  </div>
  <div class="pane" id="html-pane"><pre><code id="html-code"></code></pre></div>
  <div class="pane" id="toon-pane"><pre><code id="toon-code"></code></pre></div>
</main>

<footer class="ftr">
  <button class="btn pri" id="save-html">Save .html</button>
  <button class="btn" id="save-toon">Save .toon</button>
  <button class="btn" id="save-both">Save Both</button>
  <button class="btn hidden" id="save-fonts">Download fonts</button>
  <span class="spacer"></span>
  <span class="hint" id="hint">saved path is copied to the clipboard</span>
</footer>

<div class="loading" id="loading">
  <div class="loading-box">
    <div class="loading-row">
      <span class="loading-label" id="loading-label">Reading capture</span>
      <span class="loading-pct" id="loading-pct">0%</span>
    </div>
    <div class="loading-track"><div class="loading-fill" id="loading-fill"></div></div>
    <div class="loading-sub" id="loading-sub"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="lib/reset.js"></script>
<script src="lib/html-writer.js"></script>
<script src="lib/toon-writer.js"></script>
<script src="lib/zip.js"></script>
<script src="lib/highlight.js"></script>
<script src="export.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
:root{
  --bg:#0C0D0F; --s1:#121316; --s2:#16181B; --s3:#1B1E22;
  --line:#1E2126; --line2:#2A2D33;
  --fg:#E8E6E1; --mut:#8A8F98; --mut2:#6B7077;
  --amber:#FFB224; --amber-h:#FFC04A; --red:#FF4A3D; --green:#5FD08A;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --sans:system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  width:308px;background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:12px;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}

.hdr{
  display:flex;align-items:center;gap:8px;padding:9px 12px;background:var(--s1);
  border-bottom:1px solid var(--line2);
}
.brand{
  font-family:var(--mono);font-size:10.5px;letter-spacing:.18em;color:var(--amber);
  text-transform:uppercase;
}
.hdr .spacer{flex:1}
.ver{font-family:var(--mono);font-size:9.5px;color:var(--mut2);letter-spacing:.06em}

.status{
  display:flex;align-items:center;gap:8px;padding:10px 12px;
  border-bottom:1px solid var(--line);background:var(--s2);
}
.dot{width:7px;height:7px;background:var(--mut2);flex:0 0 auto}
.dot.on{background:var(--amber);box-shadow:0 0 0 2px rgba(255,178,36,.18)}
.dot.bad{background:var(--red)}
.dot.paused{background:#8AB4F8;box-shadow:0 0 0 2px rgba(138,180,248,.2)}
.status-text{font-family:var(--mono);font-size:11px;color:var(--mut)}
.status-text b{color:var(--fg);font-weight:400}

.actions{display:flex;gap:6px;padding:10px 12px}
.btn{
  font-family:var(--mono);font-size:11px;letter-spacing:.05em;padding:7px 0;flex:1;
  border:1px solid var(--line2);background:var(--s2);color:var(--fg);text-align:center;
}
.btn:hover:not(:disabled){border-color:#3A3E45;background:var(--s3)}
.btn:disabled{opacity:.4;cursor:default}
.btn.pri{border-color:var(--amber);color:var(--amber)}
.btn.pri:hover:not(:disabled){background:rgba(255,178,36,.09);border-color:var(--amber-h);color:var(--amber-h)}

.sect{padding:2px 12px 10px}
.label{
  font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--mut2);padding:8px 0 6px;
}
.keys{display:flex;flex-direction:column;gap:1px}
.keyrow{
  display:flex;align-items:center;gap:8px;padding:5px 8px;background:var(--s1);
  border:1px solid var(--line);
}
.keyrow .name{font-family:var(--mono);font-size:10.5px;color:var(--mut);flex:1}
.kbd{
  font-family:var(--mono);font-size:10px;padding:3px 6px;background:var(--s3);
  border:1px solid var(--line2);color:var(--fg);white-space:nowrap;
}

.toggle{
  display:flex;align-items:center;gap:7px;width:100%;padding:7px 8px;
  font-family:var(--mono);font-size:10.5px;color:var(--mut);
  border:1px solid var(--line);background:var(--s1);
}
.toggle:hover{color:var(--fg);background:var(--s2)}
.toggle .caret{font-size:8.5px;color:var(--mut2);transition:transform .12s linear}
.toggle.open .caret{transform:rotate(90deg)}

.hist-count{
  margin-left:auto;font-size:9.5px;color:var(--mut2);
}
.toggle.open .hist-count{color:var(--amber)}
.histbox{display:none;padding-top:6px}
.histbox.open{display:block}
.hist-list{display:flex;flex-direction:column;gap:1px}
.hitem{
  display:flex;align-items:baseline;gap:7px;padding:6px 8px;width:100%;text-align:left;
  background:var(--s1);border:1px solid var(--line);font-family:var(--mono);font-size:10.5px;
  color:var(--mut);
}
.hitem:hover{background:var(--s2);border-color:#3A3E45;color:var(--fg)}
.hitem:hover .hi-what{color:var(--amber-h)}
.hi-when{color:var(--mut2);flex:0 0 auto;width:52px}
.hi-what{color:var(--amber);flex:0 0 auto;max-width:112px;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.hi-where{color:var(--mut2);flex:1;min-width:0;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap;direction:rtl;text-align:left}
.hist-empty{
  font-family:var(--mono);font-size:9.5px;color:var(--mut2);padding:6px 8px;
  background:var(--s1);border:1px solid var(--line);line-height:1.5;
}
.hist-clear{
  margin-top:5px;width:100%;font-family:var(--mono);font-size:9.5px;padding:5px 0;
  border:1px solid var(--line);background:var(--s1);color:var(--mut2);
}
.hist-clear:hover{color:#E8938B;border-color:#5E2420}
.editor{display:none;padding-top:8px}
.editor.open{display:block}
.edrow{
  display:flex;align-items:center;gap:6px;padding:6px 8px;background:var(--s1);
  border:1px solid var(--line);border-bottom:0;
}
.edrow:last-of-type{border-bottom:1px solid var(--line)}
.edrow .name{font-family:var(--mono);font-size:10px;color:var(--mut);width:58px;flex:0 0 auto}
.chk{
  display:flex;align-items:center;gap:3px;font-family:var(--mono);font-size:9.5px;
  color:var(--mut2);cursor:pointer;user-select:none;
}
.chk input{
  appearance:none;-webkit-appearance:none;width:11px;height:11px;border:1px solid var(--line2);
  background:var(--s3);cursor:pointer;position:relative;
}
.chk input:checked{background:var(--amber);border-color:var(--amber)}
.chk input:checked::after{
  content:"";position:absolute;left:2px;top:2px;width:5px;height:5px;background:var(--bg);
}
.chk.on{color:var(--fg)}
.cap{
  font-family:var(--mono);font-size:10px;width:38px;flex:0 0 auto;text-align:center;
  padding:4px 0;background:var(--s3);border:1px solid var(--line2);color:var(--fg);
}
.cap:focus{outline:none;border-color:var(--amber);color:var(--amber)}
.cap.capturing{border-color:var(--amber);color:var(--amber)}
.edactions{display:flex;gap:6px;padding-top:8px}

.note{
  font-family:var(--mono);font-size:9.5px;color:var(--mut2);line-height:1.55;
  padding:8px 12px 12px;border-top:1px solid var(--line);
}
.note b{color:var(--mut);font-weight:400}
.blocked{
  margin:10px 12px;padding:9px 10px;border:1px solid #5E2420;background:#1C0F0E;
  font-family:var(--mono);font-size:10.5px;color:#E8938B;line-height:1.55;
}
.hidden{display:none !important}
</style>
</head>
<body>

<div class="hdr">
  <span class="brand">DOM Heist</span>
  <span class="spacer"></span>
  <span class="ver" id="ver"></span>
</div>

<div class="status">
  <span class="dot" id="dot"></span>
  <span class="status-text" id="status">checking page…</span>
</div>

<div id="blocked" class="blocked hidden"></div>

<div id="main">
  <div class="actions">
    <button class="btn pri" id="start">Start</button>
    <button class="btn" id="clear">Clear</button>
    <button class="btn" id="export">Export</button>
  </div>

  <div class="sect">
    <button class="toggle" id="hist-toggle">
      <span class="caret">▶</span><span>Recent captures</span>
      <span class="hist-count" id="hist-count"></span>
    </button>
    <div class="histbox" id="histbox">
      <div class="hist-list" id="hist-list"></div>
      <button class="hist-clear" id="hist-clear">Clear history</button>
    </div>

    <div class="label">Shortcuts</div>
    <div class="keys" id="keys"></div>

    <div style="height:8px"></div>
    <button class="toggle" id="customize-toggle">
      <span class="caret">▶</span><span>Customize shortcuts</span>
    </button>
    <div class="editor" id="editor">
      <div class="edrow" data-action="start">
        <span class="name">Start</span>
        <label class="chk"><input type="checkbox" data-mod="primary"><span class="mod-label"></span></label>
        <label class="chk"><input type="checkbox" data-mod="shift"><span>Shift</span></label>
        <label class="chk"><input type="checkbox" data-mod="alt"><span class="alt-label"></span></label>
        <input class="cap" data-key readonly>
      </div>
      <div class="edrow" data-action="export">
        <span class="name">Export</span>
        <label class="chk"><input type="checkbox" data-mod="primary"><span class="mod-label"></span></label>
        <label class="chk"><input type="checkbox" data-mod="shift"><span>Shift</span></label>
        <label class="chk"><input type="checkbox" data-mod="alt"><span class="alt-label"></span></label>
        <input class="cap" data-key readonly>
      </div>
      <div class="edrow" data-action="fullpage">
        <span class="name">Full page</span>
        <label class="chk"><input type="checkbox" data-mod="primary"><span class="mod-label"></span></label>
        <label class="chk"><input type="checkbox" data-mod="shift"><span>Shift</span></label>
        <label class="chk"><input type="checkbox" data-mod="alt"><span class="alt-label"></span></label>
        <input class="cap" data-key readonly>
      </div>
      <div class="edrow" data-action="grab">
        <span class="name">Grab hovered</span>
        <label class="chk"><input type="checkbox" data-mod="primary"><span class="mod-label"></span></label>
        <label class="chk"><input type="checkbox" data-mod="shift"><span>Shift</span></label>
        <label class="chk"><input type="checkbox" data-mod="alt"><span class="alt-label"></span></label>
        <input class="cap" data-key readonly>
      </div>
      <div class="edrow" data-action="pause">
        <span class="name">Interact mode</span>
        <label class="chk"><input type="checkbox" data-mod="primary"><span class="mod-label"></span></label>
        <label class="chk"><input type="checkbox" data-mod="shift"><span>Shift</span></label>
        <label class="chk"><input type="checkbox" data-mod="alt"><span class="alt-label"></span></label>
        <input class="cap" data-key readonly>
      </div>
      <div class="edrow" data-action="diagnose">
        <span class="name">Diagnose</span>
        <label class="chk"><input type="checkbox" data-mod="primary"><span class="mod-label"></span></label>
        <label class="chk"><input type="checkbox" data-mod="shift"><span>Shift</span></label>
        <label class="chk"><input type="checkbox" data-mod="alt"><span class="alt-label"></span></label>
        <input class="cap" data-key readonly>
      </div>
      <div class="edrow" data-action="history">
        <span class="name">History</span>
        <label class="chk"><input type="checkbox" data-mod="primary"><span class="mod-label"></span></label>
        <label class="chk"><input type="checkbox" data-mod="shift"><span>Shift</span></label>
        <label class="chk"><input type="checkbox" data-mod="alt"><span class="alt-label"></span></label>
        <input class="cap" data-key readonly>
      </div>
      <div class="edactions">
        <button class="btn pri" id="save-keys">Save</button>
        <button class="btn" id="reset-keys">Reset</button>
      </div>
    </div>
  </div>

  <div class="note" id="note"></div>
</div>

<script src="popup.js"></script>
</body>
</html>

<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>remote widget</title>
<style>
  html{background:#052e2b}
  body{margin:0;font:13px/1.5 system-ui,sans-serif;color:#d1fae5;padding:14px}
  .tag{display:inline-block;padding:3px 9px;border-radius:999px;background:#059669;color:#fff;font-size:11px}
  .num{font:600 22px ui-monospace,monospace;color:#6ee7b7;margin-top:8px}
  .bar{height:8px;border-radius:4px;background:#064e3b;margin-top:10px;overflow:hidden}
  .bar i{display:block;height:100%;width:64%;background:linear-gradient(90deg,#34d399,#059669)}
  .note{color:#6ee7b7;font-size:11px;margin-top:8px;font-family:ui-monospace,monospace}
</style></head>
<body>
  <span class="tag">remote widget</span>
  <div class="num">€4.62Bn</div>
  <div class="bar"><i></i></div>
  <div class="note">served from localhost:8932 — its own process</div>
</body></html>
